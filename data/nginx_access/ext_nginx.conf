upstream smerge_server {
    server 127.0.0.1:8000;
}

upstream react_ext {
    server 127.0.0.1:5069;
}

upstream access {
    server 127.0.0.1:4000;
}

upstream acapi {
    server 127.0.0.1:5000;
}

server {
    server_name localhost;

    error_page 403 /e403.html;
    location = /e403.html {
        root /usr/share/nginx/html;
        allow all;
    }

    # Backend routes to Django
    location ^~ /api/ {
        #include /etc/nginx/allowed_ips.conf;
        proxy_pass http://smerge_server;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location ^~ /action/ {
        #include /etc/nginx/allowed_ips.conf;
        proxy_pass http://smerge_server;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location ^~ /admin/ {
        #include /etc/nginx/allowed_ips.conf;
        proxy_pass http://smerge_server;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location ^~ /media/ {
        #include /etc/nginx/allowed_ips.conf;
        proxy_pass http://smerge_server;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location ^~ /static/ {
        #include /etc/nginx/allowed_ips.conf;
        proxy_pass http://smerge_server;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # Access Portal
    location /acapi/ {
        proxy_pass http://acapi;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /access/ws/ {
        proxy_pass http://access;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
    location /access/ {
        proxy_pass http://access;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location = /ext {
        return 301 /;
    }

    location ^~ /ext/ {
        #include /etc/nginx/allowed_ips.conf;
        rewrite ^/ext/(.*)$ /$1 break;
        proxy_pass http://react_ext;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
        proxy_intercept_errors on;
        error_page 404 = @react_spa;
    }

    # Default: React handles all remaining routes (SPA)
    location / {
        #include /etc/nginx/allowed_ips.conf;
        proxy_pass http://react_ext;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
        proxy_intercept_errors on;
        error_page 404 = @react_spa;
    }

    location @react_spa {
        internal;
        proxy_pass http://react_ext;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # Access Portal routes intentionally disabled in local setup:
    # location /acapi/ { proxy_pass http://acapi; }
    # location /access/ws/ { proxy_pass http://access; }
    # location /access/ { proxy_pass http://access; }

    listen 443 ssl;
    ssl_certificate /Users/ferielsliti/Documents/IDP/smerge/localhost.crt;
    ssl_certificate_key /Users/ferielsliti/Documents/IDP/smerge/localhost.key;
}

server {
    if ($host = localhost) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name localhost;
    return 404; # managed by Certbot
}
